<style>

h1,h2,h3,h4{line-height:1.12;letter-spacing:-.025em;font-weight:800;text-wrap:balance}

/* ---------- butonlar ---------- */
.btn{
  --btn-bg:var(--primary);--btn-fg:var(--on-primary);
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:15px 30px;border:0;border-radius:calc(var(--r) * .8);
  background:var(--btn-bg);color:var(--btn-fg);
  font-weight:700;font-size:.97rem;cursor:pointer;position:relative;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,filter .18s;
  box-shadow:0 8px 24px -10px rgba(var(--primary-rgb),.9);
  white-space:nowrap;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px -12px rgba(var(--primary-rgb),.95)}
.btn:active{transform:translateY(0)}
.btn--accent{--btn-bg:var(--accent);--btn-fg:var(--on-accent);
  box-shadow:0 8px 24px -10px rgba(var(--accent-rgb),.9)}
.btn--ghost{
  --btn-bg:transparent;--btn-fg:var(--fg);
  border:1px solid var(--border);box-shadow:none;backdrop-filter:blur(8px);
}
.btn--ghost:hover{border-color:var(--primary);box-shadow:none}
.btn--lg{padding:18px 38px;font-size:1.03rem}

/* ---------- kart ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:28px;position:relative;overflow:hidden;
  transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s;
}
.card:hover{transform:translateY(-6px);border-color:rgba(var(--primary-rgb),.55);box-shadow:var(--shadow-lg)}
.grid{display:grid;gap:clamp(16px,2vw,26px)}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}

/* ---------- üst menü ---------- */
.nav{
  position:fixed;inset:0 0 auto 0;z-index:60;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:14px var(--pad);transition:background .3s,backdrop-filter .3s,box-shadow .3s,padding .3s;
}
.nav.stuck{
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(18px) saturate(160%);
  box-shadow:0 1px 0 var(--border);padding-block:10px;
}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:1.06rem;letter-spacing:-.02em}

  color:var(--on-primary);font-size:1rem;font-weight:900;flex:none;
}
.nav-links{display:flex;align-items:center;gap:26px;font-size:.94rem;font-weight:600}
.nav-links a{position:relative;padding:4px 0;color:var(--muted);transition:color .2s}
.nav-links a::after{
  content:"";position:absolute;left:0;bottom:0;height:2px;width:0;
  background:var(--accent);transition:width .25s;border-radius:2px;
}
.nav-links a:hover{color:var(--fg)}
.nav-links a:hover::after{width:100%}
.nav-links .btn{padding:11px 20px;font-size:.9rem}
.nav-links .btn::after{display:none}

/* görseli olmayan ürün/hizmet için ölçüyü koruyan yer tutucu */
.noimg{display:grid;place-items:center;width:100%;height:100%;color:var(--muted);

    repeating-linear-gradient(45deg,transparent,transparent 9px,var(--surface-2) 9px,var(--surface-2) 18px)}
.nav-toggle{display:none;background:none;border:1px solid var(--border);

.nav-toggle span{display:block;width:20px;height:2px;background:var(--fg);border-radius:2px}
.nav-toggle span+span{margin-top:5px}

}

.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){

.wa-float{
  position:fixed;right:18px;bottom:18px;z-index:70;
  width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  background:#25d366;color:#fff;box-shadow:0 12px 30px -8px rgba(37,211,102,.75);
  transition:transform .2s;
}
.wa-float:hover{transform:scale(1.08)}
.wa-float svg{width:29px;height:29px;fill:currentColor}
.wa-float::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:2px solid #25d366;animation:pulse 2.4s ease-out infinite;
}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.6);opacity:0}}

<div class="lightbox" id="lb">
  <button class="lb-nav prev" id="lbPrev" aria-label="Önceki">‹</button>
  <img src="" alt="">
  <button class="lb-nav next" id="lbNext" aria-label="Sonraki">›</button>
  <span class="lb-count" id="lbCount"></span>
</div>
<script>
(function(){
  var nav=document.getElementById('nav');
  var onScroll=function(){nav.classList.toggle('stuck',window.scrollY>24)};
  onScroll();addEventListener('scroll',onScroll,{passive:true});

  var t=document.getElementById('navToggle'),l=document.getElementById('navLinks');
  if(t&&l){
    t.addEventListener('click',function(){
      var open=l.classList.toggle('open');
      t.setAttribute('aria-expanded',open?'true':'false');
    });
    l.addEventListener('click',function(e){
      if(e.target.tagName==='A')l.classList.remove('open');
    });
  }

  var els=document.querySelectorAll('.rv');
  if(!('IntersectionObserver' in window)){
    els.forEach(function(el){el.classList.add('in')});
  }else{
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(en,i){
        if(en.isIntersecting){
          var el=en.target;
          setTimeout(function(){el.classList.add('in')},(el.dataset.delay||0)*1);
          io.unobserve(el);
        }
      });
    },{rootMargin:'0px 0px -8% 0px',threshold:.08});
    els.forEach(function(el,i){
      var p=el.parentElement;
      if(p&&p.children.length>1&&p.children.length<13){el.dataset.delay=i%6*70}
      io.observe(el);
    });
  }

  /* Buyutulmus gorsel. Bir urunun birden fazla fotografi varsa ana gorsele
     data-imgs ile hepsi bagli oluyor; burada oklarla gezilebiliyor. */
  var lb=document.getElementById('lb'),lbi=lb.querySelector('img'),
      lbc=document.getElementById('lbCount'),
      prev=document.getElementById('lbPrev'),next=document.getElementById('lbNext'),
      list=[],idx=0;

  function show(i){
    if(!list.length)return;
    idx=(i+list.length)%list.length;
    lbi.src=list[idx];
    var many=list.length>1;
    prev.hidden=next.hidden=!many;
    lbc.hidden=!many;
    lbc.textContent=(idx+1)+' / '+list.length;
  }
  function open(el){
    var d=el.getAttribute('data-imgs');
    list=d?d.split('|').filter(Boolean):[el.currentSrc||el.src];
    lbi.alt=el.alt||'';
    show(0);
    lb.classList.add('on');
    document.body.style.overflow='hidden';
  }
  function close(){lb.classList.remove('on');document.body.style.overflow=''}

  document.addEventListener('click',function(e){
    var z=e.target.closest('.zoom');
    if(z){open(z);return}
    if(e.target===prev){show(idx-1);return}
    if(e.target===next){show(idx+1);return}
    if(e.target.closest('.lightbox'))close();
  });
  addEventListener('keydown',function(e){
    if(!lb.classList.contains('on'))return;
    if(e.key==='Escape')close();
    if(e.key==='ArrowLeft')show(idx-1);
    if(e.key==='ArrowRight')show(idx+1);
  });

  /* Urun arama. Kategori filtresiyle birlikte calisir: gorunur olmak icin
     urunun hem secili kategoriye hem arama metnine uymasi gerekiyor. */
  var ara=document.getElementById('urunAra');
  if(ara){
    var kartlar=[].slice.call(document.querySelectorAll('[data-ara]')),
        bos=document.getElementById('araBos'),
        bilgi=document.getElementById('araSonuc'),zaman;

    /* Turkce harfleri sadelestir: 'sise' yazan 'şişe'yi de bulsun */
    function sadelestir(t){
      return (t||'').toLocaleLowerCase('tr')
        .replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g')
        .replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c');
    }
    kartlar.forEach(function(k){k._ara=sadelestir(k.getAttribute('data-ara'))});

    function calistir(){
      var q=sadelestir(ara.value.trim()),
          kelimeler=q?q.split(/\s+/):[],gorunen=0;
      kartlar.forEach(function(k){
        var uyar=kelimeler.every(function(w){return k._ara.indexOf(w)>-1});
        k.dataset.aramaUydu=uyar?'1':'0';
        var kategoriUydu=k.dataset.katGizli!=='1';
        k.classList.toggle('hide',!(uyar&&kategoriUydu));
        if(uyar&&kategoriUydu)gorunen++;
      });
      if(bos)bos.hidden=gorunen>0;
      if(bilgi)bilgi.textContent=q?(gorunen+' ürün bulundu'):'';
    }
    ara.addEventListener('input',function(){
      clearTimeout(zaman);zaman=setTimeout(calistir,120);
    });
    window.__urunAramaCalistir=calistir;   /* kategori filtresi de tetikleyebilsin */
  }
})();
</script>
<script>
(function(){
  var t=document.getElementById('thumbs'),m=document.getElementById('shotMain');
  if(!t||!m)return;
  t.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b)return;
    m.src=b.dataset.src;
    [].forEach.call(t.children,function(c){c.classList.toggle('on',c===b)});
  });
})();
</script>
